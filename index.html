<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les repères du Brevet</title>
<meta name="description" content="Réviser les repères du DNB en histoire (frise) et en géographie (planisphère), en trois niveaux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1126;--card:#f6efe2;--card2:#efe5d2;--ink:#1c2133;--mut:#5a5e6e;--gold:#b8862f;--gold2:#e8a11c;--H:#c8862b;--G:#2f8fa6;--ok:#2e8b57;--ko:#c0392b;--line:#ddd0b6;--sea:#d4e5ed;--land:#ece2cc}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(1100px 520px at 50% -180px,#1f2753 0%,rgba(13,17,38,0) 70%);background-attachment:fixed;color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:980px;margin:0 auto;padding:18px 16px 44px}
button{font:inherit;color:inherit}
.card{background:var(--card);border-radius:22px;padding:24px 26px;margin:0 0 16px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
@media(max-width:560px){.card{padding:18px 16px;border-radius:18px}}
h1{font-family:'Barlow Condensed','Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;font-size:clamp(36px,7vw,58px);line-height:1;margin:8px 0 12px}
h2{font-family:'Barlow Condensed','Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:24px;margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 small{font-family:'Barlow';font-weight:600;font-size:14px;color:var(--mut)}
h3{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-size:21px;margin:18px 0 8px}
.kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.lead{color:#474b5b;max-width:64ch;margin:0 0 12px}
.lead.sm{font-size:15.5px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-family:'Barlow';font-size:15px;font-weight:800}
.ver{text-align:center;color:#7c84a8;font-size:12.5px;margin-top:14px;letter-spacing:.06em}
.mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:15px;color:var(--mut)}
.mbar{flex:0 0 200px;height:10px;border-radius:6px;background:#e2d6bf;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{border:2px solid var(--line);background:#fffaf0;border-radius:14px;padding:12px 10px;font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
.seg button small{display:block;font-weight:500;color:var(--mut);font-size:13.5px;margin-top:3px}
.seg.small{grid-template-columns:repeat(3,minmax(0,110px))}
.seg button.on,.lvls button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.seg button.on small,.lvls button.on span{color:#c9cbe0}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvls button{border:2px solid var(--line);background:#fffaf0;border-radius:14px;padding:14px;text-align:left;cursor:pointer}
.lvls b{display:block;font-size:16.5px;margin-bottom:4px}
.lvls span{display:block;font-size:14.5px;color:var(--mut);line-height:1.35}
@media(max-width:700px){.lvls{grid-template-columns:1fr}.seg{grid-template-columns:1fr 1fr 1fr}.seg button{padding:10px 6px;font-size:15px}}
.chk{display:flex;gap:10px;align-items:center;margin:18px 0 4px;font-size:15.5px;color:#3d4151;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;padding:12px 22px;cursor:pointer;font-size:17px}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.big{background:linear-gradient(180deg,#f0b23d,#d9941c);color:#1c2133;font-size:19px;padding:14px 28px;box-shadow:0 6px 0 #a86f12}
.btn.big:active{transform:translateY(3px);box-shadow:0 3px 0 #a86f12}
.setup .btn.big{margin-top:16px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:var(--ko);color:#fff;border-color:var(--ko)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:0;border-radius:22px;padding:20px 22px;text-align:left;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.tile:hover{transform:translateY(-2px)}
.tile .ti{font-size:30px;display:block}
.tile b{display:block;font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-size:23px;margin:6px 0 2px}
.tile small{color:var(--mut);font-size:15px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ico{width:44px;height:44px;border-radius:12px;border:2px solid #39406a;background:transparent;color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto}
.ttl{color:#fff;font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:700;font-size:26px}
.prog{flex:1;height:10px;background:#272e55;border-radius:6px;overflow:hidden}
.prog .bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.sc{color:#fff;font-weight:800;min-width:56px;text-align:right}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 10px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;background:#2a3160;color:#dfe3ff}
.chip.H{background:var(--H);color:#1c2133}.chip.G{background:var(--G);color:#fff}.chip.R{background:#7e3fa0;color:#fff}
.qn{margin-left:auto;color:#aab1d6;font-weight:700;font-size:14px}
.qtext{font-family:'Barlow Condensed','Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:clamp(23px,3.6vw,29px);line-height:1.15}
.reptag{display:inline-block;margin-top:10px;background:#1c2133;color:#f6efe2;font-weight:700;font-size:clamp(18px,2.6vw,21px);padding:8px 14px;border-radius:12px}
.sub2{color:var(--mut);font-size:15px;margin-top:6px}
.qvis{margin-top:14px}
.qvis:empty{display:none}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.olet{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-weight:800;font-size:15px}
.opt.good{background:#dff1e5;border-color:var(--ok)}.opt.good .olet{background:var(--ok);color:#fff}
.opt.bad{background:#f8e0dc;border-color:var(--ko)}.opt.bad .olet{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.ord{display:grid;gap:10px;margin-top:16px}
.oitem{display:flex;align-items:center;gap:12px;text-align:left;background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600}
.orank{flex:0 0 32px;height:32px;border-radius:50%;border:2px dashed #b9ab8c;display:grid;place-items:center;font-weight:800}
.oitem.on{border-color:var(--ink)}.oitem.on .orank{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}
.oitem.good{background:#dff1e5;border-color:var(--ok)}.oitem.bad{background:#f8e0dc;border-color:var(--ko)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.row.c{justify-content:center}
.hint{color:var(--mut);font-size:15px}
.yin{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:16px}
.yin label{display:flex;flex-direction:column;font-weight:700;font-size:14px;color:var(--mut);gap:4px}
.yin input{font:inherit;font-size:24px;font-weight:800;width:140px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fffaf0;color:var(--ink)}
.yin input:focus{outline:none;border-color:var(--ink)}
.expl{display:none;margin-top:16px;border-radius:16px;padding:14px 16px;background:#fff7e6;border:2px solid #ead9b5}
.expl.show{display:block}
.expl.okk{border-color:#9fd1b1;background:#eef8f1}.expl.noo{border-color:#e6b0a8;background:#fcefec}
.verdict{font-weight:800;font-size:18px}.okk .verdict{color:var(--ok)}.noo .verdict{color:var(--ko)}
.verdict span{font-weight:600;color:var(--ink)}
.note{font-size:15px;color:#3d4151;margin:8px 0 0}
.rc{background:#fffaf0;border-radius:12px;padding:10px 12px;margin-top:10px;border-left:5px solid var(--gold)}
.rch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rd{font-weight:800;background:var(--ink);color:#f6efe2;border-radius:8px;padding:1px 8px;font-size:15px;white-space:nowrap}
.rc p{margin:6px 0 0;font-size:15.5px;color:#3d4151}
.olist{margin-top:8px;display:grid;gap:4px;font-size:15.5px}
.nav{display:flex;justify-content:flex-end;margin-top:16px}
.center{text-align:center}
.center .lead{margin-left:auto;margin-right:auto}
.endc .big{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:800;font-size:84px;line-height:1}
.endc .big small{font-size:38px;color:var(--mut)}
.endc .pct{font-weight:800;color:var(--gold);font-size:22px;margin-bottom:8px}
.rec{font-size:16px}
.rev{text-align:left;margin:16px 0 4px}
.row.wrap{gap:10px}
.chips,.legend,.pgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.pgrid,.legend{justify-content:flex-start}
.pill{font-size:14px;font-weight:600;padding:5px 11px;border-radius:20px;border:2px solid transparent}
.p0{background:#ece6da;color:#7a7668}.p1{background:#f8dcd6;color:#8f2a1d;border-color:#e6b0a8}.p2{background:#fbeccb;color:#7a5410;border-color:#ecd093}.p3{background:#d6efdf;color:#1f6a3f;border-color:#9fd1b1}
.tabs{display:flex;gap:10px;margin:0 0 14px}
.tabs button{flex:1;border:2px solid #39406a;background:transparent;color:#dfe3ff;border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.toggles{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 10px;font-size:15px;font-weight:600}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--ink)}
details.list{margin-top:16px}
details.list summary{cursor:pointer;font-weight:700;color:var(--gold)}
.flist{columns:2;column-gap:28px;padding:0;margin:14px 0 0;list-style:none;font-size:15.5px}
@media(max-width:640px){.flist{columns:1}}
.flist li{break-inside:avoid;display:flex;gap:8px;align-items:baseline;margin:0 0 7px}
.flist .fn{flex:0 0 26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:#1c2133;color:#fff;font-weight:800;font-size:13px}
.flist em{color:var(--mut);font-size:13px}
/* ---------- carte ---------- */
.mapwrap{border-radius:14px;background:#cddfe8;border:2px solid #c3d4dd;overflow:hidden}
.ffwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.map{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.map .land,.map .bord,.map .ln,.map .lnhit,.map .foy,.map .umark line,.map .dotring,.map .pinring,.map .pin,.map .dot,.map .drom,.frise line,.frise .fband{vector-effect:non-scaling-stroke}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land);stroke:#ad9f80;stroke-width:.6}
.map .bord{fill:none;stroke:#cdbf9f;stroke-width:.45;pointer-events:none}
.map.blank .sea,.map.blank .land{cursor:crosshair}
.map .foy,.map .ln,.map .lbl,.map .pin,.map .pinring,.map .pinq,.map .dot,.map .dotring,.map .drom,.map .umark,.map #cursor{pointer-events:none}
.map [data-cand]{pointer-events:auto;cursor:pointer}
.map path.st-hl{fill:#f0b93a;stroke:#8a5a00;stroke-width:1.2}
.map path.st-cand{fill:#dcc39a;stroke:#8a7650;stroke-width:.9}
.map path.st-cand:hover{fill:#efb24c}
.map path.st-ok{fill:#86c99b;stroke:#2e6b44;stroke-width:1.2}
.map path.st-ko{fill:#eba59c;stroke:#9b2a1d}
.map path.st-fiche{fill:#d8bb8a}
.map path.st-fr{fill:#cf4a35;stroke:#8f2a1d}
.map.hide-etats path.st-fiche,.map.hide-france path.st-fr{fill:var(--land);stroke:#ad9f80}
.ln{stroke-width:2.2;fill:none}
.ln-hl{stroke:#e8a11c;stroke-width:5}
.ln-cand{stroke:#6d6553;stroke-width:2.4;stroke-dasharray:8 5}
.lnhit{stroke:rgba(0,0,0,0);stroke-width:20}
.lnhit:hover{stroke:rgba(232,161,28,.3)}
.ln-ok{stroke:var(--ok);stroke-width:4}
.ln-ko{stroke:var(--ko);stroke-width:3;stroke-dasharray:6 4}
.ln-fiche{stroke:#b03a2e;stroke-dasharray:7 4}
.ln-fiche.ln-equateur{stroke-dasharray:none}
.ln-fiche.ln-arctique,.ln-fiche.ln-antarctique{stroke:#2f6f9a}
.foy-hl{fill:url(#hatchHl);stroke:#b86a00;stroke-width:2}
.foy-cand{fill:url(#hatch);stroke:#d9711b;stroke-width:1.5}
.foy-cand:hover{stroke-width:3}
.foy-fiche{fill:url(#hatch);stroke:#d9711b;stroke-width:1.3}
.foy-ok{fill:url(#hatch);stroke:var(--ok);stroke-width:3}
.foy-ko{fill:rgba(192,57,43,.22);stroke:var(--ko);stroke-width:2}
.pin{fill:#e8a11c;stroke:#fff;stroke-width:2}
.pinring{fill:none;stroke:#e8a11c;stroke-width:2.5;opacity:.7}
.pinq{fill:#1c2133;font-family:'Barlow',sans-serif;font-weight:800;font-size:calc(13px * var(--k,1))}
.pin.pin-cand{fill:#5e6c82}.pinring.pin-cand{stroke:#5e6c82;fill:rgba(255,255,255,.02);opacity:1}
.pinring.pin-cand:hover{fill:rgba(232,161,28,.35)}
.pin.pin-ok{fill:var(--ok)}.pinring.pin-ok{stroke:var(--ok)}
.pin.pin-ko{fill:var(--ko)}.pinring.pin-ko{stroke:var(--ko)}
.dot{fill:#1c2133;stroke:#fff;stroke-width:1.5}
.dotring{fill:none;stroke:#e8a11c;stroke-width:2.8}
.dotring.dot-cand,.dotring.drom-cand{stroke:#5e6c82;stroke-width:2;fill:rgba(255,255,255,.02)}
.dotring.dot-cand:hover,.dotring.drom-cand:hover{fill:rgba(232,161,28,.4)}
.dotring.dot-ok,.dotring.drom-ok{stroke:var(--ok)}
.dot.dot-ok{fill:var(--ok)}
.dotring.dot-ko{stroke:var(--ko)}.dot.dot-ko,.drom.dot-ko{fill:var(--ko)}
.drom{fill:#d42a1a;stroke:#fff;stroke-width:1.5}
.lbl{font-family:'Barlow',sans-serif;font-weight:700;font-size:calc(13px * var(--k,1));fill:#1c2133;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:calc(3.2px * var(--k,1));stroke-linejoin:round}
.lbl-line{font-size:calc(12.5px * var(--k,1));fill:#8c2a20}
.ln-fiche~text.lbl-line{fill:#8c2a20}
.lbl-oc{font-style:italic;fill:#1f5f86;font-size:calc(14px * var(--k,1));font-weight:600}
.lbl-co{font-size:calc(13.5px * var(--k,1));letter-spacing:.14em;fill:#5a4a2a}
.lbl-st{font-size:calc(12.5px * var(--k,1))}
.lbl-foy{fill:#a8520d;font-style:italic;font-size:calc(12.5px * var(--k,1))}
.lbl-drom{fill:#a3200f;font-size:calc(11.5px * var(--k,1))}
.lbl-dim{fill:#7d7d7d;font-weight:600}
.umark line{stroke-width:4;stroke-linecap:round}
.u-ok line{stroke:var(--ok)}.u-ko line{stroke:var(--ko)}
.ucur{fill:rgba(232,161,28,.35);stroke:#b86a00;stroke-width:2}.ucur2{fill:#b86a00}
.map.hide-lignes .grp-lignes,.map.hide-oceans .grp-oceans,.map.hide-continents .grp-continents,.map.hide-etats .grp-etats,.map.hide-foyers .grp-foyers,.map.hide-metros .grp-metros,.map.hide-france .grp-france{display:none}
/* ---------- frises ---------- */
.fwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fffaf0;border-radius:14px;border:2px solid var(--line);padding:4px}
.frise{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ffiche{display:block;width:100%;min-width:640px;height:auto}
.fband{fill:#fff;stroke:#1c2133;stroke-width:1.5}
.ftick{stroke:#1c2133;stroke-width:1}.ftick.big{stroke-width:1.8}
.fyr{font-family:'Barlow',sans-serif;font-weight:600;font-size:calc(13px * var(--k,1));fill:#4a4e5e}
.fctx{fill:#bcb4a3}
.fper{fill:#c9a66b;opacity:.75}.fper.main{fill:#e8a11c;opacity:.95}
.fev{stroke:#6f6a5c;stroke-width:1.4}.fev.main{stroke:#1c2133;stroke-width:2.2}
.fevd{fill:#7a7466}.fevd.main{fill:#e8a11c;stroke:#1c2133;stroke-width:1.5}
.flead{stroke:#6f6a5c;stroke-width:1;stroke-dasharray:3 3}
.flab{font-family:'Barlow',sans-serif;font-weight:600;font-size:calc(14px * var(--k,1));fill:#55596a}.flab.main{font-weight:800;fill:#1c2133}
.fuser{stroke-width:3}.fuser.ok{stroke:var(--ok)}.fuser.ko{stroke:var(--ko)}
.fclick .fhit{fill:rgba(0,0,0,0);cursor:crosshair}
.frow{font-family:'Barlow',sans-serif;font-weight:700;font-size:calc(13px * var(--k,1));fill:#8a6a2a;letter-spacing:.06em;text-transform:uppercase}
.fpick{stroke:#e8a11c;stroke-width:4}.fpickd{fill:#e8a11c}
.ftrue{stroke:var(--ok);stroke-width:4}.ftruel{fill:var(--ok);font-family:'Barlow',sans-serif;font-weight:800;font-size:calc(15px * var(--k,1))}
.fnc{fill:#1c2133}
.fnum{font:800 11.5px 'Barlow',sans-serif;fill:#fff}
.fcont{font:700 9px 'Barlow',sans-serif;fill:#fff}
</style>
</head>
<body>

    if(!bag.length) bag=pool.filter(id=>id!==out[out.length-1]);
    const tot=bag.reduce((s,id)=>s+weight(id),0); let x=Math.random()*tot, i=0;
    for(;i<bag.length;i++){ x-=weight(bag[i]); if(x<=0) break; }
    if(i>=bag.length) i=bag.length-1;
    out.push(bag[i]); bag.splice(i,1);
  }
  return out;
}
function wchoice(list){ const tot=list.reduce((s,x)=>s+x[1],0); let r=Math.random()*tot; for(const x of list){ r-=x[1]; if(r<=0) return x[0]; } return list[list.length-1][0]; }

/* =====================================================================
   HISTOIRE : générateurs
   ===================================================================== */
const YP = (()=>{ const s=new Set(); HR.forEach(r=>{ s.add(r.s); if(r.e) s.add(r.e); }); return [...s]; })();
function nearYears(y,k,lvl){
  let c = new Set(YP.filter(v=>v!==y && Math.abs(v-y)<=15));
  if(lvl>=2){ [1,2,3].forEach(d=>{ c.add(y-d); c.add(y+d); }); }
  c = [...c].filter(v=>v!==y && v>=1905 && v<=2010 && (lvl>=2 || Math.abs(v-y)>=2));
  c.sort((a,b)=>Math.abs(a-y)-Math.abs(b-y));
  if(c.length<k){ for(let d=4; c.length<k; d++){ if(!c.includes(y-d)) c.push(y-d); if(c.length<k && !c.includes(y+d) && y+d<=2010) c.push(y+d); } }
  return shuffle(c.slice(0, Math.max(k+2,5))).slice(0,k);
}
function altPeriods(r,k){
  const near = y => { const s=new Set(YP.filter(v=>v!==y && Math.abs(v-y)<=8)); s.add(y-3); s.add(y+3); s.delete(y); return [...s]; };
  const S=near(r.s), E=near(r.e), out=[], seen=new Set([r.s+'-'+r.e]);
  S.forEach(a=>out.push([a,r.e])); E.forEach(b=>out.push([r.s,b])); S.forEach(a=>E.forEach(b=>out.push([a,b])));
  return shuffle(out).filter(p=>{ const key=p[0]+'-'+p[1]; if(p[0]>=p[1]||seen.has(key)) return false; seen.add(key); return true; }).slice(0,k);
}
const mcq = (opts) => shuffle(opts);

function hE2D(r,lvl){
  const k=LV[lvl].k-1;
  const opts = isPer(r)
    ? [{t:r.s+'-'+r.e, ok:1}].concat(altPeriods(r,k).map(p=>({t:p[0]+'-'+p[1], ok:0})))
    : [{t:String(r.s), ok:1}].concat(nearYears(r.s,k,lvl).map(y=>({t:String(y), ok:0})));
  return {dom:'H', type:'mcq', sub:'e2d', rep:r.id, show:[r.id], q: isPer(r)?"Quelles sont les dates de cette période ?":"En quelle année ?", tag:r.t, opts:mcq(opts)};
}
function hD2E(r,lvl){
  const k=LV[lvl].k-1;
  let pool = isPer(r) ? HR.filter(x=>isPer(x)&&x.id!==r.id) : HR.filter(x=>!isPer(x)&&x.s!==r.s);
  pool.sort((a,b)=>Math.abs(a.s-r.s)-Math.abs(b.s-r.s));
  const cand = lvl>=2 ? pool.slice(0, Math.max(k+2,5)) : pool;
  const ds = shuffle(cand).slice(0,k);
  return {dom:'H', type:'mcq', sub:'d2e', rep:r.id, show:[r.id], q: isPer(r)?"Quel repère correspond à cette période ?":"Quel repère correspond à cette date ?", tag:dfull(r),
    opts:mcq([{t:r.t,ok:1}].concat(ds.map(x=>({t:x.t,ok:0}))))};
}
function hFirst(r){
  const pool=HR.filter(x=>x.id!==r.id && disj(r,x,3));
  if(!pool.length) return null;
  const o=pick(pool); const old = r.s<o.s ? r : o;
  return {dom:'H', type:'mcq', sub:'first', rep:r.id, show:[old.id, old===r?o.id:r.id], q:"Lequel de ces deux repères est le plus ancien ?",
    opts:mcq([{t:old.t, ok:1},{t:(old===r?o:r).t, ok:0}])};
}
function hKind(r){
  return {dom:'H', type:'mcq', sub:'kind', rep:r.id, show:[r.id], q:"Sur ta frise, comment places-tu ce repère ?", tag:r.t,
    opts:[{t:"Un rectangle dans la frise : c'est une période", ok:isPer(r)?1:0},{t:"Un trait sous la frise, à sa date : c'est un événement", ok:isPer(r)?0:1}],
    note:"Méthode : un événement (une seule date) se place sous la frise, à la verticale de sa date ; une période (plusieurs années) se trace en rectangle dans la frise, de son début à sa fin."};
}
const inside = (P,x) => !isPer(x) && x.s>P.s && x.s<P.e;
const outside = (P,x) => !isPer(x) && (x.s<P.s || x.s>P.e);
function hDuring(r,lvl){
  const k=LV[lvl].k-1;
  if(isPer(r)){
    const ins=HR.filter(x=>inside(r,x)), outs=HR.filter(x=>outside(r,x));
    if(!ins.length || outs.length<k) return null;
    const c=pick(ins); outs.sort((a,b)=>Math.min(Math.abs(a.s-r.s),Math.abs(a.s-r.e))-Math.min(Math.abs(b.s-r.s),Math.abs(b.s-r.e)));
    const ds=shuffle(outs.slice(0,k+2)).slice(0,k);
    return {dom:'H', type:'mcq', sub:'during', rep:r.id, show:[r.id,c.id], q:"Quel repère se produit pendant cette période ?", tag: r.t+(lvl<3?' ('+dlab(r)+')':''),
      opts:mcq([{t:c.t,ok:1}].concat(ds.map(x=>({t:x.t,ok:0}))))};
  }
  const P=HR.filter(x=>isPer(x)&&inside(x,r)), N=HR.filter(x=>isPer(x)&&outside(x,r));
  if(!P.length || N.length<k) return null;
  const c=pick(P), ds=shuffle(N).slice(0,k);
  return {dom:'H', type:'mcq', sub:'during', rep:r.id, show:[r.id,c.id], q:"Pendant quelle période se produit ce repère ?", tag:r.t,
    opts:mcq([{t:c.t+(lvl<3?' ('+dlab(c)+')':''),ok:1}].concat(ds.map(x=>({t:x.t+(lvl<3?' ('+dlab(x)+')':''),ok:0}))))};
}
function setAround(r,n,gap){
  for(let tries=0; tries<40; tries++){
    const set=[r];
    for(const x of shuffle(HR)){ if(set.length>=n) break; if(set.every(y=>y.id!==x.id && disj(x,y,gap))) set.push(x); }
    if(set.length>=n) return set;
  }
  return null;
}
function hExtreme(r){
  for(const dir of shuffle(['recent','ancien'])){
    const pool=HR.filter(x=>x.id!==r.id && disj(r,x,1) && (dir==='recent' ? fin(x)<r.s : x.s>fin(r)));
    const set=[r];
    for(const x of shuffle(pool)){ if(set.length>=4) break; if(set.every(y=>y.id===r.id || disj(x,y,1))) set.push(x); }
    if(set.length>=4) return {dom:'H', type:'mcq', sub:'extreme', rep:r.id, show:set.map(x=>x.id),
      q: dir==='recent' ? "Lequel de ces repères est le plus récent ?" : "Lequel de ces repères est le plus ancien ?",
      opts:mcq(set.map(x=>({t:x.t, ok:x.id===r.id?1:0})))};
  }
  return null;
}
function hOrder(r,lvl){
  const n = lvl>=3 ? 4 : 3, gap = lvl>=3 ? 1 : 3;
  const set=setAround(r,n,gap); if(!set) return null;
  return {dom:'H', type:'order', rep:r.id, items:shuffle(set).map(x=>x.id), q:"Remets ces repères dans l'ordre chronologique : touche-les du plus ancien au plus récent."};
}
function hYear(r){ return {dom:'H', type:'year', rep:r.id, show:[r.id], q: isPer(r)?"Quelles sont les dates de début et de fin de cette période ?":"En quelle année ?", tag:r.t, per:isPer(r)}; }
function hFrise(r){ return {dom:'H', type:'frise', rep:r.id, show:[r.id], q: isPer(r)?"Clique sur la frise à l'année où commence cette période (à 2 ans près).":"Clique sur la frise à l'année de ce repère (à 2 ans près).", tag:r.t, target:r.s}; }

function genH(r,lvl,avoid){
  const W = lvl===1 ? [['e2d',3],['d2e',2],['first',2],['kind',1]]
          : lvl===2 ? [['e2d',3],['d2e',2],['during',2],['extreme',1],['order',2]]
          :           [['year',3],['order',2],['frise',2],['during',1]];
  for(let t=0;t<12;t++){
    const ty=wchoice(W); if(ty===avoid && t<8) continue;
    let q=null;
    if(ty==='e2d') q=hE2D(r,lvl); else if(ty==='d2e') q=hD2E(r,lvl); else if(ty==='first') q=hFirst(r);
    else if(ty==='kind') q=hKind(r); else if(ty==='during') q=hDuring(r,lvl); else if(ty==='extreme') q=hExtreme(r);
    else if(ty==='order') q=hOrder(r,lvl); else if(ty==='year') q=hYear(r); else if(ty==='frise') q=hFrise(r);
    if(q){ q.kindT=ty; return q; }
  }
  const q=hE2D(r,lvl); q.kindT='e2d'; return q;
}

function gIdentify(r,lvl){

const CONTN = {cAfr:"L'Afrique", cAme:"L'Amérique", cAsi:"L'Asie", cEur:"L'Europe", cOce:"L'Océanie"};
function factsFor(r,lvl){
  const L = GF.filter(f=>f.r===r.id && f.l<=lvl).map(f=>({q:f.q, o:f.o}));
  if(r.cat==='metro'){
    L.push({q:"Sur quel continent se trouve "+r.N+" ?", o:[CONTN[r.cont]].concat(shuffle(Object.keys(CONTN).filter(c=>c!==r.cont)).map(c=>CONTN[c]))});

function genG(r,lvl,avoid){

    svg.addEventListener('click',ev=>{ if(S.done) return; const p=svgPoint(svg,ev); let id=ev.target.dataset && ev.target.dataset.cand;
      if(!id){ let bd=40*CURK; q.map.pins.forEach(pn=>{ const P=M.pts[pn.key], d=Math.hypot(p.x-P[0],p.y-P[1]); if(pn.cand && d<bd){ bd=d; id=pn.cand; } });
               if(!id){ let bl=16*CURK; q.map.lines.forEach(l=>{ const d=Math.abs(p.y-M.lines[l.id].y); if(l.cand && d<bl){ bl=d; id=l.cand; } }); } }
      if(!id){ ans.innerHTML='<p class="hint">Clique sur un des éléments proposés sur la carte.</p>'; return; }
      ans.innerHTML=''; const ok = id===q.rep;
      finish(ok, ok?'':'Tu as choisi '+(GM[id]?GM[id].the:(id==='fra'?'la France métropolitaine':id))+'.', false, false, {pickedId:id}); });
  }
  else if(q.type==='blank'){
    vis.innerHTML='<div class="mapwrap">'+mapSVG(q.map,{blank:true})+'</div>';
    ans.innerHTML='<div class="row"><span class="hint" id="bh">Clique sur la carte.</span><button class="btn" id="bok" disabled>Valider</button></div>';
    const svg=vis.querySelector('svg'); let c=null;
    svg.addEventListener('click',ev=>{ if(S.done) return; const p=svgPoint(svg,ev); c={x:p.x,y:p.y,t:ev.target};
      $('cursor').innerHTML='<circle class="ucur" cx="'+p.x+'" cy="'+p.y+'" r="'+7*CURK+'"/><circle class="ucur2" cx="'+p.x+'" cy="'+p.y+'" r="'+2*CURK+'"/>';
      $('bok').disabled=false; $('bh').textContent='Tu peux cliquer ailleurs pour corriger, puis valider.'; });
    $('bok').addEventListener('click',()=>{ if(S.done||!c) return; const r=GM[q.rep]; const ok=checkBlank(r,c.x,c.y,c.t);
      ans.innerHTML=''; finish(ok, ok?'':blankHint(r,c.x,c.y,c.t), false, false, {user:{x:c.x,y:c.y,ok}}); });
  }
  window.scrollTo(0,0);
}

function repCardH(id){ const r=HM[id]; return '<div class="rc"><div class="rch"><span class="rd">'+dfull(r)+'</span><b>'+esc(r.t)+'</b></div><p>'+esc(r.x)+'</p></div>'; }
function repCardG(id){ const r=GM[id]; return '<div class="rc"><div class="rch"><b>'+esc(r.N)+'</b></div><p>'+esc(r.x)+'</p></div>'; }

function finish(ok, detail, detailIsHTML, friseDone, extra){
  const q=S.cur; S.done=true; extra=extra||{};
  credit(q.rep, ok, S.lvl);
  if(q.type==='order' && ok) q.items.forEach(id=>{ if(id!==q.rep) credit(id,true,1); });
  if(S.phase==='main'){ if(ok) S.score++; else S.missed.push({id:q.rep, kindT:q.kindT}); }
  else { if(ok) S.rok++; S.retry[S.ri].ok=ok; }
  S.log.push({id:q.rep, ok, phase:S.phase});
  // visuel de correction
  const vis=$('vis');
  if(q.dom==='H'){
    if(q.type==='frise'){ /* la frise cliquée montre déjà la correction */ }
    else vis.innerHTML='<div class="fwrap">'+friseMini(q.show||[q.rep])+'</div>';
  } else {
    const r=GM[q.rep]; const sp=revealSpec(r);
    if(extra.user) sp.user=extra.user;
    if(extra.pickedId && extra.pickedId!==q.rep){ const w=GM[extra.pickedId]; if(w){ if(w.cat==='etat') sp.shade[w.id]='st-ko'; else if(w.cat==='france') sp.shade.fra='st-ko'; else if(w.cat==='ligne') sp.lines.push({id:w.id, cls:'ln-ko'}); else if(w.cat==='foyer') sp.foy.push({id:w.id, cls:'foy-ko'}); else if(w.mk) sp.pins.push({key:w.mk[0], kind:'pin', cls:'pin-ko'}); else sp.pins.push({key:w.id, kind:w.cat==='drom'?'drom':'dot', cls:'dot-ko'}); } }
    vis.innerHTML='<div class="mapwrap">'+mapSVG(sp)+'</div>';
  }
  const cards = q.dom==='H' ? (q.type==='order' ? repCardH(q.rep) : (q.show||[q.rep]).slice(0, q.sub==='extreme'?1:2).map(repCardH).join('')) : repCardG(q.rep);
  const ex=$('expl'); ex.className='expl show '+(ok?'okk':'noo');
  ex.innerHTML='<div class="verdict">'+(ok?'✔ Bravo !':'✘ Pas tout à fait.')+(detail?(detailIsHTML?'':' <span>'+esc(detail)+'</span>'):'')+'</div>'+(detailIsHTML?detail:'')+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+cards;
  const last = S.phase==='main' ? (S.i+1>=S.list.length) : (S.ri+1>=S.retry.length);
  const act=$('act'); act.hidden=false; act.textContent = last ? (S.phase==='main' && S.missed.length ? 'Deuxième chance →' : 'Voir mon bilan →') : 'Suivant →';
  const sc=document.querySelector('.top .sc'); const v=S.phase==='main'?S.score:S.rok; if(sc) sc.textContent=v+' pt'+(v>1?'s':'');
  setTimeout(()=>{ ex.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
}

function retryIntro(){
  const seen=new Set(); S.retry=[]; S.missed.forEach(m=>{ if(!seen.has(m.id)){ seen.add(m.id); S.retry.push({id:m.id, kindT:m.kindT}); } });
  S.retry=S.retry.slice(0,12); S.phase='retry'; S.ri=0; S.rok=0;
  app.innerHTML='<div class="screen"><div class="card center"><div class="kicker">Deuxième chance</div><h1>'+S.score+' / '+S.list.length+'</h1>'
   +'<p class="lead">Tu as raté '+S.retry.length+' repère'+(S.retry.length>1?'s':'')+'. Ils reviennent maintenant, posés autrement. C\'est comme ça qu\'on les retient.</p>'
   +'<div class="chips">'+S.retry.map(m=>'<span class="pill p1">'+esc(HM[m.id]?dfull(HM[m.id])+' · '+HM[m.id].t:GM[m.id].N)+'</span>').join('')+'</div>'
   +'<div class="row c"><button class="btn big" id="rgo">Je retente ▶</button><button class="btn ghost" id="rskip">Passer au bilan</button></div></div></div>';
  $('rgo').addEventListener('click', nextQ);
  $('rskip').addEventListener('click', ()=>{ S.retry=[]; end(); });
  window.scrollTo(0,0);
}

function end(){
  const n=S.list.length, pct=Math.round(S.score/n*100);
  const still = S.retry.filter(m=>!m.ok).map(m=>m.id);
  const msg = pct>=90 ? "Excellent : ces repères sont solides." : pct>=70 ? "Bon travail. Encore quelques repères à fixer." : pct>=50 ? "C'est en cours. Revois les fiches puis rejoue." : "Commence par la fiche des repères, puis rejoue au niveau 1.";
  const up = pct>=80 && S.lvl<3;
  app.innerHTML='<div class="screen"><div class="card center endc"><div class="kicker">Bilan · '+LV[S.lvl].n+'</div><div class="big">'+S.score+'<small> / '+n+'</small></div><div class="pct">'+pct+' %</div><p class="lead">'+msg+'</p>'
   +(S.retry.length?'<p class="rec">Deuxième chance : <b>'+S.rok+' / '+S.retry.length+'</b> rattrapé'+(S.rok>1?'s':'')+'.</p>':'')
   +(still.length?'<div class="rev"><h3>À revoir en priorité</h3>'+still.map(id=>HM[id]?repCardH(id):repCardG(id)).join('')+'</div>':'')
   +'<div class="row c wrap">'+(up?'<button class="btn big" id="eup">Passer au niveau '+(S.lvl+1)+' ▶</button>':'')+'<button class="btn'+(up?' ghost':' big')+'" id="eagain">Rejouer</button><button class="btn ghost" id="efiche">Revoir les repères</button><button class="btn ghost" id="ehome">Accueil</button></div></div><div class="ver">'+VER+'</div></div>';
  if(up) $('eup').addEventListener('click',()=>{ PREF.lvl=S.lvl+1; savePref(); start(); });
  $('eagain').addEventListener('click', start);
  $('efiche').addEventListener('click', ()=>fiches(S.dom==='G'?'carte':'frise'));
  $('ehome').addEventListener('click', home);
  window.scrollTo(0,0);
}

/* ---------- fiches de révision ---------- */
const PCOL = {h1418:'#b5523b', hstal:'#7a4f9a', hhit:'#3d3d3d', h3945:'#9a2f2f', hlib:'#2f7a52', hgf:'#2f6f9a'};
const FNUM = (()=>{ const o={}; HR.slice().sort((a,b)=>a.s-b.s || (isPer(b)?1:0)-(isPer(a)?1:0)).forEach((r,i)=>o[r.id]=i+1); return o; })();
const LANE = (()=>{ const o={}, lanes=[]; HR.filter(isPer).sort((a,b)=>a.s-b.s).forEach(p=>{ let l=0; while(lanes[l]!=null && lanes[l]>=p.s) l++; lanes[l]=p.e; o[p.id]=l; }); return o; })();
function friseFiche(){
  const RW=[{s:1910,e:1945,y:50},{s:1945,e:2005,y:215}], XL=40, XR=960, BH=40;
  let s='<svg class="ffiche" viewBox="0 0 1000 335" xmlns="http://www.w3.org/2000/svg">';
  RW.forEach((R,ri)=>{
    const X=y=>XL+(y-R.s)/(R.e-R.s)*(XR-XL);
    s+='<text class="frow" x="'+XL+'" y="'+(R.y-34)+'">Frise '+(ri+1)+' : '+R.s+' → '+R.e+'</text>';
    s+='<rect class="fband" x="'+XL+'" y="'+R.y+'" width="'+(XR-XL)+'" height="'+BH+'"/>';
    for(let y=R.s;y<=R.e;y+=5){ s+='<line class="ftick big" x1="'+X(y)+'" x2="'+X(y)+'" y1="'+(R.y+BH)+'" y2="'+(R.y+BH+6)+'"/><text class="fyr" x="'+X(y)+'" y="'+(R.y+BH+19)+'" text-anchor="middle">'+y+'</text>'; }
    HR.filter(isPer).forEach(p=>{ const a=Math.max(p.s,R.s), b=Math.min(p.e,R.e); if(a>=b) return;
      s+='<rect x="'+X(a)+'" y="'+(R.y+4+LANE[p.id]*9)+'" width="'+(X(b)-X(a))+'" height="7" rx="2" fill="'+PCOL[p.id]+'"/>';
      if(p.s>=R.s && p.s<R.e) s+='<line x1="'+X(p.s)+'" x2="'+X(p.s)+'" y1="'+(R.y-12)+'" y2="'+(R.y+4+LANE[p.id]*9)+'" stroke="'+PCOL[p.id]+'" stroke-width="1.5"/><circle cx="'+X(p.s)+'" cy="'+(R.y-14)+'" r="10" fill="'+PCOL[p.id]+'"/><text class="fnum w" x="'+X(p.s)+'" y="'+(R.y-10)+'" text-anchor="middle">'+FNUM[p.id]+'</text>';
      else s+='<text class="fcont" x="'+(X(a)+4)+'" y="'+(R.y+11+LANE[p.id]*9)+'">suite '+FNUM[p.id]+'</text>';
    });
    const evs=HR.filter(r=>!isPer(r) && r.s>=R.s && (ri===0 ? r.s<=R.e : r.s>R.s)); const placed=[];
    evs.forEach(r=>{ const x=X(r.s); let lv=0; while(placed.some(p=>p.lv===lv && Math.abs(p.x-x)<22)) lv++; placed.push({x,lv});
      const cy=R.y+BH+38+lv*25;
      s+='<line class="fev" x1="'+x+'" x2="'+x+'" y1="'+(R.y+BH)+'" y2="'+(cy-10)+'"/><circle class="fnc" cx="'+x+'" cy="'+cy+'" r="10"/><text class="fnum" x="'+x+'" y="'+(cy+4)+'" text-anchor="middle">'+FNUM[r.id]+'</text>'; });
  });
  return s+'</svg>';
}
function ficheMapSpec(){
  const s={shade:{}, lines:[], foy:[], pins:[], stLabels:[]};
  ['usa','bra','chn','ind','rus','aus'].forEach(k=>{ s.shade[k]='st-fiche'; s.stLabels.push({id:k, label:GM[k].N, grp:'etats'}); });
  s.shade.fra='st-fr'; s.stLabels.push({id:'fra', label:'France', grp:'france'});
  GR.filter(r=>r.cat==='ligne').forEach(r=>s.lines.push({id:r.id, cls:'ln-fiche', label:r.N, grp:'lignes'}));
  GR.filter(r=>r.cat==='foyer').forEach(r=>s.foy.push({id:r.id, cls:'foy-fiche', label:r.N, grp:'foyers'}));
  GR.filter(r=>r.cat==='ocean').forEach(r=>r.mk.forEach(k=>s.pins.push({key:k, kind:'none', label:r.N, lcls:'lbl-oc', grp:'oceans'})));
  GR.filter(r=>r.cat==='continent').forEach(r=>r.mk.forEach(k=>s.pins.push({key:k, kind:'none', label:r.N.toUpperCase(), lcls:'lbl-co', grp:'continents'})));
  GR.filter(r=>r.cat==='metro').forEach(r=>s.pins.push({key:r.id, kind:'dot', cls:'dot-fiche', label:r.N, grp:'metros'}));
  GR.filter(r=>r.cat==='drom').forEach(r=>s.pins.push({key:r.id, kind:'drom', cls:'drom-fiche', label:r.N, lcls:'lbl-drom', grp:'france'}));
  return s;
}
const LAYERS=[['lignes','Lignes'],['oceans','Océans'],['continents','Continents'],['etats','Grands États'],['foyers','Foyers de peuplement'],['metros','Métropoles'],['france','France et DROM']];
function fiches(tab){
  app.innerHTML='<div class="screen"><div class="top"><button class="ico" id="back">←</button><div class="ttl">Revoir les repères</div></div>'
   +'<div class="tabs"><button data-t="frise">📜 La frise</button><button data-t="carte">🗺️ Le planisphère</button></div><div id="fc"></div><div class="ver">'+VER+'</div></div>';
  $('back').addEventListener('click', home);
  const show=t=>{ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
    if(t==='frise') $('fc').innerHTML='<div class="card"><h2>Les 21 repères de la frise</h2><p class="lead sm">Comme sur ta feuille : deux frises, de 1910 à 1945 puis de 1945 à 2005. Les <b>périodes</b> sont des rectangles de couleur <b>dans</b> la frise ; les <b>événements</b> se placent <b>sous</b> la frise, à la verticale de leur date. La période de Staline est à cheval sur les deux frises : son rectangle est coupé, pas la période.</p>'
      +'<div class="fwrap ffwrap">'+friseFiche()+'</div>'
      +'<ol class="flist">'+HR.slice().sort((a,b)=>FNUM[a.id]-FNUM[b.id]).map(r=>'<li><span class="fn" style="'+(isPer(r)?'background:'+PCOL[r.id]+';color:#fff':'')+'">'+FNUM[r.id]+'</span><span class="rd">'+dfull(r)+'</span> '+esc(r.t)+(isPer(r)?' <em>période</em>':'')+'</li>').join('')+'</ol>'
      +'<details class="list"><summary>Voir les explications de chaque repère</summary>'+HR.map(r=>repCardH(r.id)).join('')+'</details></div>';
    else { $('fc').innerHTML='<div class="card"><h2>Le planisphère des repères</h2><p class="lead sm">Pour t\'auto-tester : masque une couche, récite les noms, puis réaffiche-la.</p>'
      +'<div class="toggles">'+LAYERS.map(l=>'<label><input type="checkbox" data-l="'+l[0]+'" checked> '+l[1]+'</label>').join('')+'</div>'
      +'<div class="mapwrap fiche">'+mapSVG(ficheMapSpec())+'</div>'
      +'<details class="list"><summary>Voir la liste avec les explications</summary>'+GR.map(r=>repCardG(r.id)).join('')+'</details></div>';
      const svg=$('fc').querySelector('svg');
      $('fc').querySelector('.toggles').addEventListener('change',e=>{ const l=e.target.dataset.l; if(l) svg.classList.toggle('hide-'+l, !e.target.checked); }); }
  };
  document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });
  show(tab||'frise'); window.scrollTo(0,0);
}

/* ---------- progrès ---------- */
function progress(){
  const lab=['jamais vu','fragile','en cours','maîtrisé'];
  const grid=(arr,isH)=>'<div class="pgrid">'+arr.map(r=>{ const s=st(r.id); return '<span class="pill p'+s+'" title="'+lab[s]+'">'+esc(isH?dlab(r)+' · '+r.t:r.N)+'</span>'; }).join('')+'</div>';
  const ch=counts(HR.map(r=>r.id)), cg=counts(GR.map(r=>r.id));
  app.innerHTML='<div class="screen"><div class="top"><button class="ico" id="back">←</button><div class="ttl">Mes progrès</div></div>'
   +'<div class="card"><p class="lead sm">Un repère devient <b>maîtrisé</b> quand tu y réponds juste plusieurs fois, surtout aux niveaux 2 et 3. Une erreur le fait redescendre. Tes progrès restent enregistrés sur cet appareil.</p>'
   +'<div class="legend"><span class="pill p0">jamais vu</span><span class="pill p1">fragile</span><span class="pill p2">en cours</span><span class="pill p3">maîtrisé</span></div>'
   +'<h2>📜 Frise <small>'+ch[3]+' / '+HR.length+' maîtrisés</small></h2>'+grid(HR,true)
   +'<h2>🗺️ Planisphère <small>'+cg[3]+' / '+GR.length+' maîtrisés</small></h2>'+grid(GR,false)
   +'<div class="row c"><button class="btn ghost" id="reset">Remettre mes progrès à zéro</button></div></div><div class="ver">'+VER+'</div></div>';
  $('back').addEventListener('click', home);
  const rb=$('reset'); let armed=false;
  rb.addEventListener('click',()=>{ if(!armed){ armed=true; rb.textContent='Clique encore pour confirmer'; rb.classList.add('danger'); return; } MS={}; saveMS(); progress(); });
  window.scrollTo(0,0);
}

/* points d'entrée pour les tests */
window.__RDNB = {genH, genG, HM, GM, checkBlank, inv, oceanOf, M, mapSVG};
home();
})();
